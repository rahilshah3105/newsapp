<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2980b9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1abc9c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecf0f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="20" cy="20" r="19" fill="url(#logoGradient)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Newspaper Icon -->
  <g transform="translate(8, 8)">
    <!-- Main newspaper body -->
    <rect x="2" y="2" width="20" height="16" rx="2" fill="url(#iconGradient)" opacity="0.95"/>
    
    <!-- Folded corner -->
    <path d="M 20 2 L 24 2 L 20 6 Z" fill="url(#iconGradient)" opacity="0.8"/>
    
    <!-- Headlines -->
    <rect x="4" y="4" width="14" height="1.5" rx="0.5" fill="#3498db" opacity="0.8"/>
    <rect x="4" y="6.5" width="12" height="1" rx="0.5" fill="#3498db" opacity="0.6"/>
    <rect x="4" y="8" width="10" height="1" rx="0.5" fill="#3498db" opacity="0.4"/>
    
    <!-- Content lines -->
    <rect x="4" y="10.5" width="16" height="0.8" rx="0.4" fill="#7f8c8d" opacity="0.7"/>
    <rect x="4" y="12" width="14" height="0.8" rx="0.4" fill="#7f8c8d" opacity="0.5"/>
    <rect x="4" y="13.5" width="12" height="0.8" rx="0.4" fill="#7f8c8d" opacity="0.3"/>
    
    <!-- Pulse wave effect -->
    <circle cx="6" cy="6" r="1" fill="#e74c3c" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Subtle glow effect -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(52,152,219,0.3)" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="18;19;18" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>